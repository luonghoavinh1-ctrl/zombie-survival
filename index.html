<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Zombie Survival</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05080b;
  font-family:Arial,sans-serif;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

#loading{
  position:fixed;
  inset:0;
  z-index:9999;
  background:#05080b;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  font-weight:bold;
}

#loading small{
  margin-top:10px;
  opacity:.6;
}

#hud{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:20;
  color:white;
}

#top{
  position:absolute;
  top:10px;
  left:10px;
  right:10px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.box{
  background:rgba(0,0,0,.5);
  border:1px solid rgba(255,255,255,.15);
  border-radius:12px;
  padding:8px 11px;
  text-shadow:0 1px 3px #000;
}

#leftInfo{
  line-height:1.45;
}

#mission{
  position:absolute;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  text-align:center;
  min-width:190px;
}

#missionTitle{
  font-size:13px;
  opacity:.75;
}

#missionCount{
  font-size:20px;
  font-weight:bold;
}

#timer{
  font-size:17px;
  color:#ffd54a;
}

#rank{
  font-size:12px;
  margin-top:2px;
}

#rightInfo{
  text-align:right;
  line-height:1.5;
}

#hpWrap{
  position:absolute;
  left:12px;
  bottom:18px;
  width:210px;
}

#hpBar{
  height:16px;
  border-radius:10px;
  background:#222;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.3);
}

#hpFill{
  width:100%;
  height:100%;
  background:#34e27a;
  transition:.15s;
}

#hpText{
  font-weight:bold;
  margin-top:3px;
  font-size:13px;
}

#ammo{
  position:absolute;
  right:15px;
  bottom:18px;
  font-size:24px;
  font-weight:bold;
}

#crosshair{
  position:absolute;
  left:50%;
  top:50%;
  width:24px;
  height:24px;
  transform:translate(-50%,-50%);
}

#crosshair:before,
#crosshair:after{
  content:"";
  position:absolute;
  background:white;
  box-shadow:0 0 4px #000;
}

#crosshair:before{
  left:11px;
  top:2px;
  width:2px;
  height:20px;
}

#crosshair:after{
  left:2px;
  top:11px;
  width:20px;
  height:2px;
}

#crosshair.locked:before,
#crosshair.locked:after{
  background:#ff3030;
}

#joystick{
  position:absolute;
  left:22px;
  bottom:72px;
  width:125px;
  height:125px;
  border-radius:50%;
  background:rgba(255,255,255,.08);
  border:2px solid rgba(255,255,255,.18);
  pointer-events:auto;
}

#stick{
  position:absolute;
  left:37px;
  top:37px;
  width:48px;
  height:48px;
  border-radius:50%;
  background:rgba(255,255,255,.28);
  border:2px solid rgba(255,255,255,.4);
}

.btn{
  pointer-events:auto;
  position:absolute;
  border:1px solid rgba(255,255,255,.25);
  color:white;
  background:rgba(0,0,0,.55);
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:bold;
}

#fire{
  right:25px;
  bottom:78px;
  width:92px;
  height:92px;
  background:rgba(180,20,20,.55);
  font-size:18px;
}

#reload{
  right:135px;
  bottom:52px;
  width:65px;
  height:65px;
  font-size:11px;
}

#menuBtn{
  pointer-events:auto;
  position:absolute;
  right:12px;
  top:62px;
  width:42px;
  height:42px;
  border-radius:10px;
  background:rgba(0,0,0,.55);
  color:white;
  border:1px solid rgba(255,255,255,.2);
  font-size:22px;
}

#menu{
  display:none;
  position:fixed;
  z-index:100;
  inset:0;
  background:rgba(0,0,0,.78);
  align-items:center;
  justify-content:center;
}

.panel{
  width:min(92vw,400px);
  background:#10151b;
  color:white;
  border:1px solid #33404c;
  border-radius:18px;
  padding:22px;
  box-shadow:0 20px 70px #000;
}

.panel h2{
  margin:0 0 8px;
  text-align:center;
}

.panel input{
  width:100%;
  padding:13px;
  border-radius:10px;
  border:1px solid #384550;
  background:#080b0f;
  color:white;
  margin:10px 0;
  font-size:16px;
}

.action{
  width:100%;
  border:0;
  border-radius:11px;
  padding:13px;
  margin-top:8px;
  font-weight:bold;
  color:white;
  background:#1769aa;
}

.action.red{
  background:#9b2525;
}

#leaderboard{
  margin-top:12px;
  max-height:260px;
  overflow:auto;
  background:#080b0f;
  border-radius:10px;
  padding:8px;
}

.rankrow{
  display:flex;
  justify-content:space-between;
  padding:7px 4px;
  border-bottom:1px solid #222;
  font-size:13px;
}

#gameOver{
  display:none;
  position:fixed;
  inset:0;
  z-index:90;
  background:rgba(0,0,0,.82);
  align-items:center;
  justify-content:center;
}

.center{
  text-align:center;
}

.big{
  font-size:34px;
  font-weight:bold;
  margin-bottom:10px;
}

#notice{
  position:absolute;
  left:50%;
  top:62%;
  transform:translate(-50%,-50%);
  color:white;
  font-size:18px;
  font-weight:bold;
  text-align:center;
  opacity:0;
  transition:.2s;
  text-shadow:0 2px 5px #000;
}
</style>
</head>

<body>

<div id="loading">
  <div>ĐANG TẢI ZOMBIE SURVIVAL...</div>
  <small>Chuẩn bị chiến đấu</small>
</div>

</div>

<div id="menu">
  <div class="panel">

    <div>

</div>

<div id="gameOver">

    <div class="big" id="resultTitle">THẤT BẠI</div>

    <div id="resultText"></div>

    <button class="action" id="nextMatch">CHƠI TIẾP</button>
    <button class="action" id="retry">CHƠI LẠI TRẬN</button>
    <button class="action red" id="resultMenu">MENU</button>
  </div>
</div>

/* =========================================================

const loading = document.getElementById("loading");

/* =========================================================

========================================================= */

let playerName =
localStorage.getItem("zs_player_name") || "Player";

let match =
Number(localStorage.getItem("zs_match") || 1);

let stars =
Number(localStorage.getItem("zs_stars") || 1);

function getRank(stars){

  if(stars >= 999) return "☠️ SIÊU CAO THỦ";
  if(stars >= 800) return "⚡ ĐẠI CAO THỦ";
  if(stars >= 600) return "👑 CAO THỦ";
  if(stars >= 400) return "🔥 KIM CƯƠNG";
  if(stars >= 200) return "💎 BẠCH KIM";
  if(stars >= 100) return "🥇 VÀNG";
  if(stars >= 50) return "🥈 BẠC";
  if(stars >= 10) return "🥉 ĐỒNG";

  return "🪵 TÂN BINH";
}

function getMissionTarget(m){

  const early = {
    1:10,
    2:15,
    3:20,
    4:30,
    5:40,
    6:50,
    7:65,
    8:80,
    9:100,
    10:120
  };

  if(early[m]) return early[m];

  if(m <= 20)
    return Math.round(
      120 + (m-10) * 13
    );

  if(m <= 50)
    return Math.round(
      250 + (m-20) * (350/30)
    );

  if(m <= 100)
    return Math.round(
      600 + (m-50) * 10
    );

  if(m <= 150)
    return Math.round(
      1100 + (m-100) * 10
    );

  if(m <= 200)
    return Math.round(
      1600 + (m-150) * 8
    );

  return 2000;
}

let missionTarget = getMissionTarget(match);

function saveProgress(){

  localStorage.setItem(
    "zs_player_name",
    playerName
  );

  localStorage.setItem(
    "zs_match",
    match
  );

  localStorage.setItem(
    "zs_stars",
    stars
  );
}

function updateRank(){

  starsEl.textContent =
    stars >= 999 ? "999+" : stars;

  rankEl.textContent =
    getRank(stars);

  missionEl.textContent =
    match;

  missionCount.textContent =
    `${kills} / ${missionTarget}`;

  playerNameEl.textContent =
    playerName;
}

updateRank();

/* =========================================================

========================================================= */

const scene = new THREE.Scene();

scene.background =
new THREE.Color(0x071018);

scene.fog =

/* =========================================================

const groundMat =
new THREE.MeshStandardMaterial({

});

new THREE.Mesh(

/* ROAD */

const roadMat =
new THREE.MeshStandardMaterial({
  color:0x22282b,

});

function makeRoad(

){

makeRoad(0,0,12,240);

new THREE.MeshBasicMaterial({

/* =========================================================
   HOUSES
========================================================= */

function makeHouse(x,z){

  const group =
  new THREE.Group();

  const body =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      8,5,7
    ),
    new THREE.MeshStandardMaterial({
      color:
      new THREE.Color().setHSL(
        Math.random(),

    })

  body.position.y=2.5;
  body.castShadow=true;

  const roof =
  new THREE.Mesh(
    new THREE.ConeGeometry(
      6,3,4
    ),
    new THREE.MeshStandardMaterial({
      color:0x30343a
    })
  );

  roof.position.y=6;
  roof.rotation.y=Math.PI/4;
  roof.castShadow=true;
  group.add(roof);

  const door =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      1.4,2.5,.12
    ),
    new THREE.MeshStandardMaterial({
      color:0x16191c
    })
  );

  door.position.set(
    0,1.25,3.55
  );

  group.add(door);

  const windowMat =
  new THREE.MeshBasicMaterial({
    color:0xffd66b
  });

  for(const wx of [-2.3,2.3]){

    const win =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        1.4,1.4,.1
      ),
      windowMat
    );

    win.position.set(
      wx,2.7,3.56
    );

    group.add(win);
  }

  group.position.set(
    x,0,z
  );

  scene.add(group);
}

function createZombie(){

    new THREE.PlaneGeometry(

    ),
    new THREE.MeshBasicMaterial({
      color:0xff2222,

    0,3.001,.01

  z.add(bar);

  z.userData = {
    hp:5,
    maxHp:5,
    speed:1.2+Math.random()*.7,
    attack:8,
    attackTimer:0,
    hpBar:bar
  };

  const angle =

  const dist =
  30+Math.random()*30;

  z.position.set(

    0,
    player.position.z+
    Math.cos(angle)*dist
  );

  scene.add(z);

  zombies.push(z);
}

function spawnWave(){

  const amount =
  Math.min(
    5 + wave*2,
    35
  );

  for(let i=0;i<amount;i++){
    createZombie();
  }
}

/* =========================================================
   REMOVE ZOMBIE
========================================================= */

function killZombie(z){

  const index =
  zombies.indexOf(z);

  if(index>=0)
    zombies.splice(index,1);

  scene.remove(z);

  kills++;
  score+=100;

  if(kills%10===0){
    wave++;
  }

  updateHUD();
}

/* =========================================================
   AUTO TARGET
========================================================= */

function findTarget(){

  let best=null;
  let bestScore=-999;

  const forward =
  new THREE.Vector3(0,0,-1);

  forward.applyQuaternion(
    player.quaternion
  );

  for(const z of zombies){

    const dir =
    new THREE.Vector3()
    .subVectors(
      z.position,
      player.position
    );

    const distance =
    dir.length();

    if(distance>35)
      continue;

    dir.normalize();

    const dot =
    forward.dot(dir);

    if(dot<.35)
      continue;

    const value =
    dot*2 - distance*.025;

    if(value>bestScore){

      bestScore=value;
      best=z;
    }
  }

  targetZombie=best;

  crosshair.classList.toggle(
    "locked",
    !!targetZombie
  );
}

/* =========================================================
   SHOOT
========================================================= */

function shoot(){

  if(!gameRunning)
    return;

  if(reloading)
    return;

  const now=performance.now();

  if(now-lastShot<shootCooldown)
    return;

  lastShot=now;

  if(ammo<=0){

    reload();
    return;
  }

  ammo--;

  /* target */

  findTarget();

  if(targetZombie){

    const z=targetZombie;

    const headshot =
      Math.random()<.2;

    const damage =
      headshot ? 3 : 1;

    z.userData.hp -= damage;

    const ratio =
      Math.max(
        0,
        z.userData.hp /
        z.userData.maxHp
      );

    z.userData.hpBar.scale.x =
      ratio;

    if(headshot){

      showNotice(
        "💥 HEADSHOT!"
      );

      score+=50;
    }

    createTracer(z);

    if(z.userData.hp<=0){

      killZombie(z);
    }

  }else{

    createTracer();
  }

  gunKick();

  updateHUD();
}

/* =========================================================
   TRACER
========================================================= */

function createTracer(z){

  const start =
  new THREE.Vector3();

  gun.getWorldPosition(start);

  let end;

  if(z){

    end =
    z.position.clone();

    end.y+=1.4;

  }else{

    const dir =
    new THREE.Vector3(
      0,0,-1
    );

    dir.applyQuaternion(
      player.quaternion
    );

    end =
    start.clone()
    .add(
      dir.multiplyScalar(30)
    );
  }

  const distance =
  start.distanceTo(end);

  const tracer =
  new THREE.Mesh(
    new THREE.CylinderGeometry(
      .025,.025,distance,5
    ),
    new THREE.MeshBasicMaterial({
      color:0xffe58a
    })
  );

  tracer.position.copy(
    start.clone().lerp(end,.5)
  );

  tracer.quaternion.setFromUnitVectors(
    new THREE.Vector3(0,1,0),
    end.clone().sub(start).normalize()
  );

  scene.add(tracer);

  setTimeout(()=>{
    scene.remove(tracer);
  },60);
}

/* =========================================================
   GUN KICK
========================================================= */

let gunKickTime=0;

function gunKick(){

  gun.position.z=-.85;

  gunKickTime=1;
}

/* =========================================================
   RELOAD
========================================================= */

function reload(){

  if(reloading)
    return;

  if(ammo>=maxAmmo)
    return;

  reloading=true;

  showNotice("🔄 ĐANG NẠP ĐẠN...");

  setTimeout(()=>{

    ammo=maxAmmo;
    reloading=false;

    updateHUD();

  },1200);
}

/* =========================================================
   ZOMBIE AI
========================================================= */

function updateZombies(dt){

  for(const z of [...zombies]){

    const dir =
    new THREE.Vector3()
    .subVectors(
      player.position,
      z.position
    );

    const distance =
    dir.length();

    if(distance>.01)
      dir.normalize();

    if(distance>1.8){

      z.position.add(
        dir.multiplyScalar(
          z.userData.speed*dt
        )
      );

      z.lookAt(
        player.position.x,
        1,
        player.position.z
      );

    }else{

      z.userData.attackTimer -= dt;

      if(z.userData.attackTimer<=0){

        z.userData.attackTimer=.9;

        hp -= z.userData.attack;

        if(hp<0)
          hp=0;

        updateHUD();

        if(hp<=0){

          endGame(false);

          return;
        }
      }
    }

    /* HP bar always face camera */

    const bar =
    z.userData.hpBar;

    if(bar)
      bar.lookAt(camera.position);
  }
}

/* =========================================================
   CAMERA
========================================================= */

let cameraYaw=0;
let cameraPitch=.15;

function updateCamera(){

  const distance=7;

  const height=4;

  const x =
  player.position.x -
  Math.sin(cameraYaw)*distance;

  const z =
  player.position.z -
  Math.cos(cameraYaw)*distance;

  camera.position.lerp(
    new THREE.Vector3(
      x,
      player.position.y+height,
      z
    ),
    .15
  );

  camera.lookAt(
    player.position.x,
    1.4,
    player.position.z
  );

  player.rotation.y =
    cameraYaw;
}

/* =========================================================
   JOYSTICK
========================================================= */

const joystick =
document.getElementById("joystick");

const stick =
document.getElementById("stick");

let joyX=0;
let joyY=0;

let joyActive=false;

function updateJoy(e){

  const rect =
  joystick.getBoundingClientRect();

  const cx =
  rect.left+rect.width/2;

  const cy =
  rect.top+rect.height/2;

  let dx =
  e.clientX-cx;

  let dy =
  e.clientY-cy;

  const max=38;

  const len =
  Math.hypot(dx,dy);

  if(len>max){

    dx=
      dx/len*max;

    dy=
      dy/len*max;
  }

  joyX=dx/max;
  joyY=dy/max;

  stick.style.transform=
    `translate(${dx}px,${dy}px)`;
}

joystick.addEventListener(
  "pointerdown",
  e=>{
    joyActive=true;
    joystick.setPointerCapture(e.pointerId);
    updateJoy(e);
  }
);

joystick.addEventListener(
  "pointermove",
  e=>{
    if(joyActive)
      updateJoy(e);
  }
);

joystick.addEventListener(
  "pointerup",
  ()=>{
    joyActive=false;
    joyX=0;
    joyY=0;
    stick.style.transform=
      "translate(0,0)";
  }
);

/* =========================================================
   CAMERA SWIPE
========================================================= */

let swipe=false;
let lastX=0;

renderer.domElement.addEventListener(
  "pointerdown",
  e=>{
    swipe=true;
    lastX=e.clientX;
  }
);

renderer.domElement.addEventListener(
  "pointermove",
  e=>{

    if(!swipe)
      return;

    const dx =
    e.clientX-lastX;

    lastX=e.clientX;

    cameraYaw -= dx*.008;
  }
);

renderer.domElement.addEventListener(
  "pointerup",
  ()=>{
    swipe=false;
  }
);

/* =========================================================
   FIRE BUTTON
========================================================= */

const fire =
document.getElementById("fire");

fire.addEventListener(
  "pointerdown",
  e=>{
    e.preventDefault();
    shoot();
  }
);

/* =========================================================
   RELOAD BUTTON
========================================================= */

document.getElementById(
  "reload"
).addEventListener(
  "pointerdown",
  e=>{
    e.preventDefault();
    reload();
  }
);

/* =========================================================
   KEYBOARD
========================================================= */

const keys={};

addEventListener(
  "keydown",
  e=>{
    keys[e.key.toLowerCase()]=true;

    if(e.key==="r")
      reload();

    if(e.code==="Space")
      shoot();
  }
);

addEventListener(
  "keyup",
  e=>{
    keys[e.key.toLowerCase()]=false;
  }
);

/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function updatePlayer(dt){

  let forward =
    -joyY;

  let side =
    joyX;

  if(keys.w)
    forward=1;

  if(keys.s)
    forward=-1;

  if(keys.a)
    side=-1;

  if(keys.d)
    side=1;

  const speed=5;

  const dir =
  new THREE.Vector3();

  dir.z += forward;
  dir.x += side;

  if(dir.lengthSq()>0){

    dir.normalize();

    const angle =
    cameraYaw;

    const rx =
    dir.x*Math.cos(angle) -
    dir.z*Math.sin(angle);

    const rz =
    dir.x*Math.sin(angle) +
    dir.z*Math.cos(angle);

    player.position.x +=
      rx*speed*dt;

    player.position.z +=
      rz*speed*dt;
  }
}

/* =========================================================
   HUD
========================================================= */

function updateHUD(){

  waveEl.textContent=wave;
  killsEl.textContent=kills;
  scoreEl.textContent=score;

  const displayStars =
    stars>=999 ? "999+" : stars;

  starsEl.textContent=
    displayStars;

  rankEl.textContent=
    getRank(stars);

  ammoEl.textContent=
    `${ammo} / ${maxAmmo}`;

  hpFill.style.width=
    `${Math.max(0,hp)}%`;

  hpText.textContent=
    `HP ${Math.ceil(hp)} / ${maxHp}`;

  missionCount.textContent=
    `${Math.min(kills,missionTarget)} / ${missionTarget}`;

  timerEl.textContent=
    formatTime(timeLeft);
}

function formatTime(sec){

  sec=Math.max(0,Math.floor(sec));

  const m=
    String(Math.floor(sec/60))
    .padStart(2,"0");

  const s=
    String(sec%60)
    .padStart(2,"0");

  return `${m}:${s}`;
}

let noticeTimer;

function showNotice(text){

  notice.textContent=text;
  notice.style.opacity="1";

  clearTimeout(noticeTimer);

  noticeTimer=setTimeout(()=>{
    notice.style.opacity="0";
  },900);
}

/* =========================================================
   TIMER
========================================================= */

let lastTimer=performance.now();

function updateTimer(){

  if(!gameRunning)
    return;

  const now=performance.now();

  if(now-lastTimer>=1000){

    lastTimer=now;

    timeLeft--;

    if(timeLeft<0)
      timeLeft=0;

    updateHUD();

    if(timeLeft<=0){

      if(kills>=missionTarget)
        endGame(true);
      else
        endGame(false);
    }
  }
}

/* =========================================================
   WIN CHECK
========================================================= */

function checkWin(){

  if(!gameRunning)
    return;

  if(kills>=missionTarget){

    endGame(true);
  }
}

/* =========================================================
   END GAME
========================================================= */

let resultSaved=false;

async function endGame(win){

  if(!gameRunning)
    return;

  gameRunning=false;

  if(win){

    stars++;

    match++;

    saveProgress();

    resultSaved=false;

    document.getElementById(
      "resultTitle"
    ).textContent=
      "🏆 CHIẾN THẮNG!";

    document.getElementById(
      "resultText"
    ).innerHTML=
      `Nhiệm vụ hoàn thành!<br>
       ⭐ +1 sao<br>
       🏆 ${getRank(stars)}<br>
       ☠️ ${kills} kills<br>
       💰 ${score} điểm`;

  }else{

    document.getElementById(
      "resultTitle"
    ).textContent=
      "💀 THẤT BẠI";

    document.getElementById(
      "resultText"
    ).innerHTML=
      `Bạn chưa hoàn thành nhiệm vụ.<br>
       ☠️ ${kills} / ${missionTarget} kills<br>
       ⭐ ${stars>=999?"999+":stars} sao`;
  }

  gameOver.style.display="flex";

  updateHUD();

  await saveScore();
}

/* =========================================================
   RESET MATCH
========================================================= */

function resetGame(){

  for(const z of zombies)
    scene.remove(z);

  zombies.length=0;

  hp=100;
  ammo=maxAmmo;
  reloading=false;

  kills=0;
  score=0;
  wave=1;

  timeLeft=180;

  missionTarget=
    getMissionTarget(match);

  gameRunning=true;

  gameOver.style.display="none";

  spawnWave();

  updateHUD();
}

/* =========================================================
   SUPABASE LEADERBOARD
========================================================= */

async function saveScore(){

  if(resultSaved)
    return;

  resultSaved=true;

  try{

    await fetch(
      SUPABASE_URL+
      "/rest/v1/scores",
      {
        method:"POST",

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":
            "Bearer "+SUPABASE_KEY,
          "Content-Type":
            "application/json",
          "Prefer":
            "return=minimal"
        },

        body:JSON.stringify({
          name:playerName,
          score:score,
          kills:kills,
          wave:wave
        })
      }
    );

  }catch(e){

    console.log(
      "Không lưu được leaderboard",
      e
    );
  }
}

async function loadLeaderboard(){

  leaderboard.style.display="block";

  leaderboard.innerHTML=
    "⏳ Đang tải TOP 100...";

  try{

    const url =
      SUPABASE_URL+
      "/rest/v1/scores"+
      "?select=name,score,kills,wave"+
      "&order=score.desc"+
      "&limit=100";

    const res =
      await fetch(
        url,
        {
          headers:{
            "apikey":SUPABASE_KEY,
            "Authorization":
              "Bearer "+SUPABASE_KEY
          }
        }
      );

    const data =
      await res.json();

    if(!Array.isArray(data)){

      leaderboard.innerHTML=
        "Không tải được bảng xếp hạng.";

      return;
    }

    leaderboard.innerHTML="";

    data.forEach(
      (p,i)=>{

        const row =
        document.createElement("div");

        row.className="rankrow";

        row.innerHTML=
          `<span>
             #${i+1} ${escapeHtml(p.name)}
           </span>
           <span>
             ${p.score} điểm
           </span>`;

        leaderboard.appendChild(row);
      }
    );

    if(data.length===0){

      leaderboard.innerHTML=
        "Chưa có người chơi.";
    }

  }catch(e){

    leaderboard.innerHTML=
      "Lỗi kết nối Supabase.";
  }
}

function escapeHtml(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

/* =========================================================
   GAME LOOP
========================================================= */

let last=performance.now();

function animate(){

  requestAnimationFrame(animate);

  const now=performance.now();

  const dt=
    Math.min(
      (now-last)/1000,
      .05
    );

  last=now;

  if(gameRunning){

    updatePlayer(dt);

    updateZombies(dt);

    findTarget();

    updateTimer();

    checkWin();

    if(gunKickTime>0){

      gunKickTime-=dt;

      if(gunKickTime<=0)
        gun.position.z=-.65;
    }

  }

  updateCamera();

  renderer.render(
    scene,
    camera
  );
}

/* =========================================================
   RESIZE
========================================================= */

addEventListener(
  "resize",
  ()=>{
    camera.aspect=
      innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );
  }
);

/* =========================================================
   START
========================================================= */

setTimeout(()=>{

  loading.style.display="none";

  spawnWave();

  updateHUD();

  animate();

},700);
